apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  annotations:
    opendatahub.io/image-display-name: Jupyter | PyTorch | CUDA | Python 3.12
    notebooks.opendatahub.io/last-image-version-git-commit-selection: 8e73cac
    notebooks.opendatahub.io/last-image-selection: 'pytorch:3.4'
    openshift.io/description: ''
    openshift.io/display-name: preemption-example
    opendatahub.io/hardware-profile-namespace: team-b-kueue-example
    opendatahub.io/hardware-profile-name: team-b
    opendatahub.io/mlflow-instance: mlflow
    opendatahub.io/connections: ''
    notebooks.opendatahub.io/inject-auth: 'true'
    opendatahub.io/workbench-image-namespace: '' 
  name: preemption-example
  namespace: team-b-kueue-example
  labels:
    app: preemption-example
    kueue.x-k8s.io/queue-name: team-b
    opendatahub.io/dashboard: 'true'
    opendatahub.io/odh-managed: 'true'
spec:
  template:
    spec:
      containers:
        - resources:
            limits:
              cpu: '2'
              memory: 4Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '2'
              memory: 4Gi
              nvidia.com/gpu: '1'
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/team-b-kueue-example/preemption-example/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          name: preemption-example
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/team-b-kueue-example/preemption-example/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                                  --ServerApp.token=''
                                  --ServerApp.password=''
                                  --ServerApp.base_url=/notebook/team-b-kueue-example/preemption-example
                                  --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: 'image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:3.4'
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /opt/app-root/src/
              name: preemption-example-storage
            - mountPath: /dev/shm
              name: shm
            - mountPath: /opt/app-root/pipeline-runtimes/
              name: runtime-images
          image: 'image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:3.4'
          workingDir: /opt/app-root/src
      enableServiceLinks: false
      serviceAccountName: preemption-example
      volumes:
        - name: preemption-example-storage
          persistentVolumeClaim:
            claimName: preemption-example-storage
        - emptyDir:
            medium: Memory
          name: shm
        - configMap:
            name: pipeline-runtime-images
            optional: true
          name: runtime-images
