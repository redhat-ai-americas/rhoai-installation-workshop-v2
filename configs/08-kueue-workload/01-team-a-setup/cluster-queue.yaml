apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a
spec:
  cohortName: gpu-cohort
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: team-a-kueue-example
  queueingStrategy: BestEffortFIFO
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Any
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: nvidia-gpu
          resources:
            - name: cpu
              nominalQuota: '8'
            - name: memory
              nominalQuota: 16Gi
            - name: nvidia.com/gpu
              nominalQuota: '1'
              borrowingLimit: '1'
  stopPolicy: None
