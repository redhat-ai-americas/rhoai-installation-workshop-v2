kind: ConfigMap
apiVersion: v1
metadata:
  annotations:
    platform.opendatahub.io/instance.name: default-gateway
    platform.opendatahub.io/type: OpenShift AI Self-Managed
  name: data-science-gateway-config
  namespace: openshift-ingress
  labels:
    platform.opendatahub.io/part-of: gatewayconfig
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                limits:
                    memory: 2Gi
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "data-science-gateway-service-tls"
    spec:
      type: ClusterIP
