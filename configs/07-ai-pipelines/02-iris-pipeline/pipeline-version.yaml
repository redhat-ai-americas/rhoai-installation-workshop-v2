apiVersion: pipelines.kubeflow.org/v2beta1
kind: PipelineVersion
metadata:
  name: iris-pipeline
  namespace: ai-pipeline-example
  labels:
    pipelines.kubeflow.org/pipeline: iris-pipeline
    pipelines.kubeflow.org/pipeline-id: b0be6e5e-ceba-4126-bd9e-ac6228ad5094
spec:
  displayName: iris-pipeline
  pipelineName: iris-pipeline
  pipelineSpec:
    components:
      comp-data-prep:
        executorLabel: exec-data-prep
        outputDefinitions:
          artifacts:
            x_test_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            x_train_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            y_test_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            y_train_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
      comp-evaluate-model:
        executorLabel: exec-evaluate-model
        inputDefinitions:
          artifacts:
            model_file:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
            x_test_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            y_test_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
        outputDefinitions:
          artifacts:
            mlpipeline_metrics_file:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
      comp-model-to-onnx:
        executorLabel: exec-model-to-onnx
        inputDefinitions:
          artifacts:
            model_file:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
        outputDefinitions:
          artifacts:
            onnx_model_file:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
      comp-train-model:
        executorLabel: exec-train-model
        inputDefinitions:
          artifacts:
            x_train_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            y_train_file:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
        outputDefinitions:
          artifacts:
            model_file:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
      comp-validate-model:
        executorLabel: exec-validate-model
        inputDefinitions:
          artifacts:
            onnx_model_file:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
    deploymentSpec:
      executors:
        exec-data-prep:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - data_prep
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"'  &&  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def data_prep(
                    x_train_file: dsl.Output[dsl.Dataset],
                    x_test_file: dsl.Output[dsl.Dataset],
                    y_train_file: dsl.Output[dsl.Dataset],
                    y_test_file: dsl.Output[dsl.Dataset],
                ):
                    import pickle

                    import pandas as pd
                    from sklearn import datasets
                    from sklearn.model_selection import train_test_split

                    def get_iris_data() -> pd.DataFrame:
                        iris = datasets.load_iris()
                        data = pd.DataFrame(
                            {
                                "sepalLength": iris.data[:, 0],
                                "sepalWidth": iris.data[:, 1],
                                "petalLength": iris.data[:, 2],
                                "petalWidth": iris.data[:, 3],
                                "species": iris.target,
                            }
                        )

                        print("Initial Dataset:")
                        print(data.head())

                        return data

                    def create_training_set(dataset: pd.DataFrame, test_size: float = 0.3):
                        # Features
                        x = dataset[["sepalLength", "sepalWidth", "petalLength", "petalWidth"]]
                        # Labels
                        y = dataset["species"]

                        # Split dataset into training set and test set
                        x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=test_size, random_state=11)

                        return x_train, x_test, y_train, y_test

                    def save_pickle(object_file, target_object):
                        with open(object_file, "wb") as f:
                            pickle.dump(target_object, f)

                    dataset = get_iris_data()
                    x_train, x_test, y_train, y_test = create_training_set(dataset)

                    save_pickle(x_train_file.path, x_train)
                    save_pickle(x_test_file.path, x_test)
                    save_pickle(y_train_file.path, y_train)
                    save_pickle(y_test_file.path, y_test)

            image: 'image-registry.openshift-image-registry.svc:5000/openshift/python:latest'
        exec-evaluate-model:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - evaluate_model
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"'  &&  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def evaluate_model(
                    x_test_file: dsl.Input[dsl.Dataset],
                    y_test_file: dsl.Input[dsl.Dataset],
                    model_file: dsl.Input[dsl.Model],
                    mlpipeline_metrics_file: dsl.Output[dsl.Metrics],
                ):
                    import json
                    import pickle

                    from sklearn.metrics import accuracy_score

                    def load_pickle(object_file):
                        with open(object_file, "rb") as f:
                            target_object = pickle.load(f)  # noqa: S301

                        return target_object

                    x_test = load_pickle(x_test_file.path)
                    y_test = load_pickle(y_test_file.path)
                    model = load_pickle(model_file.path)

                    y_pred = model.predict(x_test)

                    accuracy_score_metric = accuracy_score(y_test, y_pred)
                    print(f"Accuracy: {accuracy_score_metric}")

                    metrics = {
                        "metrics": [
                            {
                                "name": "accuracy-score",
                                "numberValue": accuracy_score_metric,
                                "format": "PERCENTAGE",
                            },
                        ]
                    }

                    with open(mlpipeline_metrics_file.path, "w") as f:
                        json.dump(metrics, f)

            image: 'image-registry.openshift-image-registry.svc:5000/openshift/python:latest'
        exec-model-to-onnx:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - model_to_onnx
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"'  &&  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'skl2onnx' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def model_to_onnx(model_file: dsl.Input[dsl.Model], onnx_model_file: dsl.Output[dsl.Model]):
                    import pickle

                    from skl2onnx import to_onnx
                    from skl2onnx.common.data_types import FloatTensorType

                    def load_pickle(object_file):
                        with open(object_file, "rb") as f:
                            target_object = pickle.load(f)  # noqa: S301

                        return target_object

                    model = load_pickle(model_file.path)

                    initial_type = [("float_input", FloatTensorType([None, 4]))]
                    onnx_model = to_onnx(model, initial_types=initial_type)

                    with open(onnx_model_file.path, "wb") as f:
                        f.write(onnx_model.SerializeToString())

            image: 'image-registry.openshift-image-registry.svc:5000/openshift/python:latest'
        exec-train-model:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - train_model
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"'  &&  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def train_model(
                    x_train_file: dsl.Input[dsl.Dataset],
                    y_train_file: dsl.Input[dsl.Dataset],
                    model_file: dsl.Output[dsl.Model],
                ):
                    import pickle

                    import pandas as pd
                    from sklearn.ensemble import RandomForestClassifier

                    def load_pickle(object_file):
                        with open(object_file, "rb") as f:
                            target_object = pickle.load(f)  # noqa: S301

                        return target_object

                    def save_pickle(object_file, target_object):
                        with open(object_file, "wb") as f:
                            pickle.dump(target_object, f)

                    def train_iris(x_train: pd.DataFrame, y_train: pd.DataFrame):
                        model = RandomForestClassifier(n_estimators=100)
                        model.fit(x_train, y_train)

                        return model

                    x_train = load_pickle(x_train_file.path)
                    y_train = load_pickle(y_train_file.path)

                    model = train_iris(x_train, y_train)

                    save_pickle(model_file.path, model)

            image: 'image-registry.openshift-image-registry.svc:5000/openshift/python:latest'
        exec-validate-model:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - validate_model
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"'  &&  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'onnxruntime' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def validate_model(onnx_model_file: dsl.Input[dsl.Model]):
                    import onnxruntime

                    session = onnxruntime.InferenceSession(onnx_model_file.path)

                    input_name = session.get_inputs()[0].name
                    label_name = session.get_outputs()[0].name

                    input_values = [[5, 3, 1.6, 0.2]]

                    print(f"Performing test prediction on {input_values}")
                    result = session.run([label_name], {input_name: input_values})[0]

                    print(f"Response: {result}")

            image: 'image-registry.openshift-image-registry.svc:5000/openshift/python:latest'
    pipelineInfo:
      name: iris-pipeline
    root:
      dag:
        tasks:
          data-prep:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-data-prep
            taskInfo:
              name: data-prep
          evaluate-model:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-evaluate-model
            dependentTasks:
              - data-prep
              - train-model
            inputs:
              artifacts:
                model_file:
                  taskOutputArtifact:
                    outputArtifactKey: model_file
                    producerTask: train-model
                x_test_file:
                  taskOutputArtifact:
                    outputArtifactKey: x_test_file
                    producerTask: data-prep
                y_test_file:
                  taskOutputArtifact:
                    outputArtifactKey: y_test_file
                    producerTask: data-prep
            taskInfo:
              name: evaluate-model
          model-to-onnx:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-model-to-onnx
            dependentTasks:
              - train-model
            inputs:
              artifacts:
                model_file:
                  taskOutputArtifact:
                    outputArtifactKey: model_file
                    producerTask: train-model
            taskInfo:
              name: model-to-onnx
          train-model:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-train-model
            dependentTasks:
              - data-prep
            inputs:
              artifacts:
                x_train_file:
                  taskOutputArtifact:
                    outputArtifactKey: x_train_file
                    producerTask: data-prep
                y_train_file:
                  taskOutputArtifact:
                    outputArtifactKey: y_train_file
                    producerTask: data-prep
            taskInfo:
              name: train-model
          validate-model:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-validate-model
            dependentTasks:
              - model-to-onnx
            inputs:
              artifacts:
                onnx_model_file:
                  taskOutputArtifact:
                    outputArtifactKey: onnx_model_file
                    producerTask: model-to-onnx
            taskInfo:
              name: validate-model
      inputDefinitions:
        parameters:
          model_obc:
            defaultValue: iris-model
            isOptional: true
            parameterType: STRING
    schemaVersion: 2.1.0
    sdkVersion: kfp-2.13.0
