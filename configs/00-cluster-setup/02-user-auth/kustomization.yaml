apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-config

resources:
  - htpasswd-oauth-provider.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: htpasswd-local
    namespace: openshift-config
    files:
      - htpasswd=.htpasswd
    type: Opaque
